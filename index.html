
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Imgur Upload</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
  <h2>Upload Image to Imgur (Hidden)</h2>

  <label for="clientId">Client ID:</label>
  <input type="text" id="clientId" placeholder="Enter your Imgur Client ID">
  <button onclick="saveClientId()">Save</button>
  <br><br>

  <input type="file" id="fileInput"><br><br>
  <button onclick="upload()">Upload</button>
  <p id="result"></p>

  <script>
    const clientIdInput = document.getElementById('clientId');
    const result = document.getElementById('result');

    window.onload = () => {
      const saved = localStorage.getItem('imgur_client_id');
      if (saved) {
        clientIdInput.value = saved;
      }
    };

    function saveClientId() {
      const id = clientIdInput.value.trim();
      if (!id) {
        alert('Client ID is empty!');
        return;
      }
      localStorage.setItem('imgur_client_id', id);
      alert('Client ID saved!');
    }

    async function upload() {
      const fileInput = document.getElementById('fileInput');
      const clientId = localStorage.getItem('imgur_client_id');

      if (!clientId) {
        result.textContent = 'Please enter and save a Client ID first.';
        return;
      }

      if (!fileInput.files.length) {
        result.textContent = 'Please choose a file.';
        return;
      }

      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append('image', file);

      result.textContent = 'Uploading...';

      try {
        const response = await fetch('https://api.imgur.com/3/image', {
          method: 'POST',
          headers: {
            Authorization: 'Client-ID ' + clientId
          },
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          result.innerHTML = `
            <b>Success!</b><br>
            <a href="${data.data.link}" target="_blank">${data.data.link}</a><br>
            <small>Delete hash (save it!): ${data.data.deletehash}</small>
          `;
        } else {
          result.textContent = 'Upload failed: ' + data.data.error;
        }
      } catch (error) {
        result.textContent = 'Error: ' + error.message;
      }
    }
  </script>
</body>
</html>
